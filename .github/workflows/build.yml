name: Build

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      commit:
        required: true
        type: string
    outputs:
      version:
        description: Full version
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $lines = & ./tools/version.ps1 -Channel "${{ inputs.channel }}" -Commit "${{ inputs.commit }}"
          $map = @{}
          foreach ($line in $lines) {
            $key, $value = $line.Split('=', 2)
            $map[$key] = $value
          }
          "version=$($map['VersionFull'])" >> $env:GITHUB_OUTPUT

      - name: Build PCLCS
        run: dotnet build PCLCS\PCLCS.csproj -c Release -p:PclaChannel=${{ inputs.channel }} -p:PclaCommit=${{ inputs.commit }}

      - name: Test
        run: dotnet test tests\PCLCS.Tests\PCLCS.Tests.csproj -c Release -p:PclaChannel=${{ inputs.channel }} -p:PclaCommit=${{ inputs.commit }}

      - name: Build PCLA
        run: msbuild PCLA\PCLA.vbproj -t:Rebuild -p:Configuration=Release -p:PclaChannel=${{ inputs.channel }} -p:PclaCommit=${{ inputs.commit }} -m:2

      - uses: actions/upload-artifact@v4
        with:
          name: PCLA-${{ steps.version.outputs.version }}
          path: |
            PCLA\bin\PCLA.exe
            LICENCE
            README.md
            CHANGELOG.md
          retention-days: 90

name: Tests

on:
  push:
    paths:
      - 'PCLCS/**'
      - 'tests/**'
      - 'MeloongCore/**'
      - 'PCLA.sln'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'PCLCS/**'
      - 'tests/**'
      - 'MeloongCore/**'
      - 'PCLA.sln'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/PCLCS.Tests/PCLCS.Tests.csproj -c Release --logger "console;verbosity=normal"
